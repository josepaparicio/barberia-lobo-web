<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barbería Lobo — Panel del día</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Arvo:wght@400;700&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1A1815;
    --ink-soft:#252220;
    --leather:#5C3A21;
    --cream:#EFE6D8;
    --cream-dim:#E2D6C2;
    --red:#9E2B25;
    --steel:#B8B2A6;
    --line: rgba(239,230,216,0.15);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--cream);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .display{font-family:'Bebas Neue',sans-serif; letter-spacing:1px;}
  .mono{font-family:'Space Mono',monospace;}
  .wrap{max-width:760px;margin:0 auto;padding:40px 24px 80px;}

  header{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:36px;flex-wrap:wrap;gap:16px;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand svg{flex:0 0 auto;}
  .brand .display{font-size:24px;}
  .brand .sub{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--red);}

  .date-control{
    display:flex;align-items:center;gap:10px;background:var(--ink-soft);
    border:1px solid var(--line);padding:10px 14px;
  }
  .date-control label{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--steel);}
  .date-control input[type=date]{
    background:transparent;border:none;color:var(--cream);font-family:'Space Mono',monospace;
    font-size:14px;color-scheme:dark;
  }
  .date-control input[type=date]:focus{outline:none;}

  .day-heading{margin-bottom:22px;}
  .day-heading .label{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--red);margin-bottom:6px;}
  .day-heading h1{font-family:'Arvo',serif;font-size:26px;margin:0;text-transform:capitalize;}
  .day-heading .count{color:var(--steel);font-size:14px;margin-top:4px;}

  .state-msg{
    border:1px dashed var(--line);padding:40px 24px;text-align:center;
    color:var(--steel);font-size:14px;
  }
  .state-msg strong{display:block;color:var(--cream);font-family:'Arvo',serif;font-size:17px;margin-bottom:6px;}

  .cita-list{border-top:1px solid var(--line);}
  .cita-row{
    display:grid;grid-template-columns:70px 1fr auto;gap:16px;align-items:center;
    padding:16px 4px;border-bottom:1px solid var(--line);
  }
  .cita-hora{font-family:'Space Mono',monospace;font-size:18px;color:var(--cream);}
  .cita-info .cliente{font-family:'Arvo',serif;font-size:16px;color:var(--cream);}
  .cita-info .detalle{font-size:13px;color:var(--steel);margin-top:2px;}
  .cita-info .detalle a{color:var(--steel);text-decoration:none;border-bottom:1px dotted var(--steel);}
  .cita-info .detalle a:hover{color:var(--cream);border-color:var(--cream);}
  .barbero-tag{
    font-family:'Space Mono',monospace;font-size:11px;letter-spacing:1px;text-transform:uppercase;
    padding:6px 10px;border:1px solid var(--line);white-space:nowrap;color:var(--steel);
  }
  .barbero-tag.tono{border-color:var(--leather);color:var(--cream-dim);}
  .barbero-tag.chuy{border-color:var(--red);color:var(--cream-dim);}

  .refresh-btn{
    display:inline-flex;align-items:center;gap:8px;margin-top:28px;
    background:transparent;border:1px solid var(--line);color:var(--steel);
    padding:10px 18px;font-family:'Space Mono',monospace;font-size:12px;letter-spacing:1px;
    text-transform:uppercase;cursor:pointer;
  }
  .refresh-btn:hover{color:var(--cream);border-color:var(--cream);}

  @media(max-width:480px){
    .cita-row{grid-template-columns:56px 1fr;}
    .barbero-tag{grid-column:1 / -1;justify-self:start;}
  }

  /* ---- Pantalla de acceso (contraseña compartida) ---- */
  #login-gate{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:24px;
  }
  .login-box{
    width:100%;max-width:320px;background:var(--ink-soft);
    border:1px solid var(--line);padding:32px 28px;text-align:center;
  }
  .login-box .display{font-size:22px;margin-bottom:2px;}
  .login-box .sub{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--red);margin-bottom:24px;}
  .login-box label{display:block;text-align:left;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--steel);margin-bottom:6px;}
  .login-box input[type=password]{
    width:100%;background:var(--ink);border:1px solid var(--line);color:var(--cream);
    padding:10px 12px;font-family:'Space Mono',monospace;font-size:14px;margin-bottom:14px;
  }
  .login-box input[type=password]:focus{outline:none;border-color:var(--red);}
  .login-box button{
    width:100%;background:var(--red);border:none;color:var(--cream);
    padding:11px 18px;font-family:'Space Mono',monospace;font-size:12px;letter-spacing:1px;
    text-transform:uppercase;cursor:pointer;
  }
  .login-box button:disabled{opacity:0.6;cursor:default;}
  .login-box .login-error{color:var(--red);font-size:12px;margin-top:12px;min-height:16px;}
</style>
</head>
<body>

<div id="login-gate">
  <div class="login-box">
    <div class="display">BARBERÍA LOBO</div>
    <div class="sub">Panel del día</div>
    <form id="login-form">
      <label for="input-clave">Contraseña</label>
      <input type="password" id="input-clave" autocomplete="current-password" required>
      <button type="submit" id="btn-login">Entrar</button>
      <div class="login-error" id="login-error"></div>
    </form>
  </div>
</div>

<div class="wrap" id="app-content" style="display:none;">
  <header>
    <div class="brand">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#9E2B25" stroke-width="1.6">
        <path d="M4 12h9l6-4-2 4 2 4-6-4H4z"/>
        <circle cx="4" cy="12" r="2" fill="#9E2B25" stroke="none"/>
      </svg>
      <div>
        <div class="display">BARBERÍA LOBO</div>
        <div class="sub">Panel del día</div>
      </div>
    </div>
    <div class="date-control">
      <label for="input-fecha">Fecha</label>
      <input type="date" id="input-fecha">
    </div>
  </header>

  <div class="day-heading">
    <div class="label">Agenda</div>
    <h1 id="heading-fecha">—</h1>
    <div class="count" id="heading-count"></div>
  </div>

  <div id="content"></div>

  <button class="refresh-btn" id="btn-refresh">↻ Actualizar</button>
</div>

<script>
/* ============================================================
   Cambia esta URL cuando muevas Node-RED de tu máquina a un
   servidor real (misma variable que en barberia-lobo.html).
============================================================ */
const API_BASE = 'https://barber-m3g4.onrender.com';

/* ============================================================
   ACCESO — contraseña compartida. Se guarda solo en sessionStorage
   (se borra al cerrar la pestaña), nunca en el HTML ni en el código.
============================================================ */
const CLAVE_KEY = 'panelClaveBarberia';

const loginGate = document.getElementById('login-gate');
const appContent = document.getElementById('app-content');
const loginForm = document.getElementById('login-form');
const inputClave = document.getElementById('input-clave');
const btnLogin = document.getElementById('btn-login');
const loginError = document.getElementById('login-error');

function claveGuardada(){
  return sessionStorage.getItem(CLAVE_KEY);
}

function mostrarApp(){
  loginGate.style.display = 'none';
  appContent.style.display = 'block';
  inputFecha.value = hoyStr();
  cargarCitas(inputFecha.value);
}

function mostrarLogin(mensaje){
  sessionStorage.removeItem(CLAVE_KEY);
  appContent.style.display = 'none';
  loginGate.style.display = 'flex';
  loginError.textContent = mensaje || '';
  inputClave.value = '';
  inputClave.focus();
}

loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const clave = inputClave.value;
  btnLogin.disabled = true;
  btnLogin.textContent = 'Entrando…';
  loginError.textContent = '';

  try{
    // Probamos la contraseña contra el propio endpoint de citas.
    const res = await fetch(`${API_BASE}/api/citas-dia?fecha=${hoyStr()}`, {
      headers: { 'x-panel-clave': clave }
    });
    if(res.status === 401){
      loginError.textContent = 'Contraseña incorrecta.';
      btnLogin.disabled = false;
      btnLogin.textContent = 'Entrar';
      return;
    }
    if(!res.ok) throw new Error('Respuesta no OK');

    sessionStorage.setItem(CLAVE_KEY, clave);
    mostrarApp();
  }catch(err){
    console.error(err);
    loginError.textContent = 'No se pudo conectar. Intenta de nuevo.';
  }
  btnLogin.disabled = false;
  btnLogin.textContent = 'Entrar';
});

const inputFecha = document.getElementById('input-fecha');
const headingFecha = document.getElementById('heading-fecha');
const headingCount = document.getElementById('heading-count');
const content = document.getElementById('content');

function hoyStr(){
  // Fecha LOCAL del navegador (no UTC) — evita el mismo desfase de
  // un día que se corrigió en barberia-lobo.html.
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function fmtEncabezado(fechaStr){
  const d = new Date(fechaStr+'T00:00:00');
  return d.toLocaleDateString('es-MX', { weekday:'long', day:'numeric', month:'long' });
}

function barberoClass(nombre){
  const n = (nombre||'').toLowerCase();
  if(n === 'tono') return 'tono';
  if(n === 'chuy') return 'chuy';
  return '';
}

async function cargarCitas(fecha){
  headingFecha.textContent = fmtEncabezado(fecha);
  content.innerHTML = `<div class="state-msg">Consultando agenda…</div>`;
  headingCount.textContent = '';

  try{
    const res = await fetch(`${API_BASE}/api/citas-dia?fecha=${encodeURIComponent(fecha)}`, {
      headers: { 'x-panel-clave': claveGuardada() || '' }
    });
    if(res.status === 401){
      mostrarLogin('Tu sesión expiró. Vuelve a entrar.');
      return;
    }
    if(!res.ok) throw new Error('Respuesta no OK');
    const data = await res.json();
    const citas = data.citas || [];

    if(citas.length === 0){
      content.innerHTML = `<div class="state-msg"><strong>Sin citas este día</strong>Todavía no hay reservaciones para esta fecha.</div>`;
      headingCount.textContent = '0 citas';
      return;
    }

    headingCount.textContent = citas.length === 1 ? '1 cita' : `${citas.length} citas`;
    content.innerHTML = `<div class="cita-list">` + citas.map(c => `
      <div class="cita-row">
        <div class="cita-hora mono">${c.hora}</div>
        <div class="cita-info">
          <div class="cliente">${c.cliente}</div>
          <div class="detalle">${c.servicio} · <a href="tel:${c.telefono}">${c.telefono}</a></div>
        </div>
        <div class="barbero-tag ${barberoClass(c.barbero)}">${c.barbero}</div>
      </div>
    `).join('') + `</div>`;

  }catch(err){
    console.error(err);
    content.innerHTML = `<div class="state-msg"><strong>No se pudo cargar la agenda</strong>Revisa que Node-RED esté corriendo y vuelve a intentar.</div>`;
  }
}

inputFecha.addEventListener('change', () => cargarCitas(inputFecha.value));
document.getElementById('btn-refresh').addEventListener('click', () => cargarCitas(inputFecha.value));

if(claveGuardada()){
  mostrarApp();
} else {
  loginGate.style.display = 'flex';
}
</script>

</body>
</html>
